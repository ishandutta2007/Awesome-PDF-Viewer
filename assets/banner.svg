<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <radialGradient id="meshGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.06); }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0; }
        25% { opacity: 0.7; }
        50% { transform: translateY(180px); opacity: 0.9; }
        75% { opacity: 0.7; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .floating-card-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-card-2 { animation: floatReverse 6s ease-in-out infinite; }
      .pulsing-glow { animation: pulseGlow 5s ease-in-out infinite; }
      .laser-beam { animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .animated-dash { stroke-dasharray: 6 4; animation: dashMove 3s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Pulsing Glows (Deep Background) -->
  <circle cx="240" cy="140" r="220" fill="url(#meshGlow1)" class="pulsing-glow" />
  <circle cx="960" cy="280" r="240" fill="url(#meshGlow2)" class="pulsing-glow" />

  <!-- Background Decorative Geometry: Floating PDF Cards (Left and Right Flanks) -->
  <!-- Left Decorative Document Card -->
  <g class="floating-card-1" transform="translate(60, 80)">
    <rect width="130" height="170" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.75" />
    <path d="M 90 0 L 130 40 L 90 40 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="20" y="24" width="45" height="16" rx="4" fill="#ef4444" opacity="0.8" />
    <text x="32" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="700">PDF</text>
    <rect x="20" y="55" width="90" height="5" rx="2.5" fill="#38bdf8" opacity="0.6" />
    <rect x="20" y="70" width="75" height="5" rx="2.5" fill="#475569" opacity="0.6" />
    <rect x="20" y="85" width="85" height="5" rx="2.5" fill="#475569" opacity="0.6" />
    <rect x="20" y="100" width="60" height="5" rx="2.5" fill="#475569" opacity="0.6" />
    <rect x="20" y="125" width="40" height="24" rx="4" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="0.8" />
    <text x="40" y="141" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="10">8ms</text>
  </g>

  <!-- Left Connecting Laser / Flow -->
  <path d="M 195 160 Q 250 160 300 200" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" class="animated-dash" />

  <!-- Right Decorative Document Card -->
  <g class="floating-card-2" transform="translate(1010, 150)">
    <rect width="130" height="170" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.75" />
    <path d="M 90 0 L 130 40 L 90 40 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="20" y="24" width="55" height="16" rx="4" fill="#818cf8" opacity="0.8" />
    <text x="30" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="700">HTML5</text>
    <rect x="20" y="55" width="90" height="5" rx="2.5" fill="#818cf8" opacity="0.6" />
    <rect x="20" y="70" width="80" height="5" rx="2.5" fill="#475569" opacity="0.6" />
    <rect x="20" y="85" width="70" height="5" rx="2.5" fill="#475569" opacity="0.6" />
    <rect x="20" y="100" width="85" height="5" rx="2.5" fill="#475569" opacity="0.6" />
    <circle cx="40" cy="137" r="12" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="0.8" />
    <text x="40" y="141" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="10">✓</text>
  </g>

  <!-- Right Connecting Laser / Flow -->
  <path d="M 900 210 Q 950 250 1005 250" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.4" class="animated-dash" />

  <!-- Central Foreground Content Group (High Contrast & Clear) -->
  <g id="foreground-content">
    <!-- Top Status Pill -->
    <g transform="translate(470, 75)">
      <rect x="0" y="0" width="260" height="30" rx="15" fill="#131c31" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="32" y="19" fill="#38bdf8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title (Crisp, High Contrast, Gradient) -->
    <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Ubuntu, sans-serif" font-weight="900" font-size="44" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome PDF Viewer
    </text>

    <!-- Subtitle (Clear, readable foreground) -->
    <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Ubuntu, sans-serif" font-weight="600" font-size="17" fill="#e2e8f0" letter-spacing="0.2">
      Lightweight Desktop Readers, Browser Engines, SaaS Viewers &amp; Annotation Tools
    </text>

    <!-- Secondary Explainer -->
    <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Ubuntu, sans-serif" font-weight="400" font-size="13.5" fill="#94a3b8">
      A comprehensive production guide for Developers, Researchers &amp; Document Architects
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(245, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="34" rx="17" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="82" y="21" text-anchor="middle" fill="#38bdf8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600">⚡ Instant Rendering</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="165" height="34" rx="17" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="262" y="21" text-anchor="middle" fill="#818cf8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600">🌐 Browser-Native PDF</text>

      <!-- Pill 3 -->
      <rect x="360" y="0" width="165" height="34" rx="17" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="442" y="21" text-anchor="middle" fill="#c084fc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600">📝 Annotations &amp; Forms</text>

      <!-- Pill 4 -->
      <rect x="540" y="0" width="165" height="34" rx="17" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="622" y="21" text-anchor="middle" fill="#34d399" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600">🔒 Zero-Bloat &amp; FOSS</text>
    </g>
  </g>
</svg>
